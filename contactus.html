<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contactus.css">
    <link rel="shortcut icon" href="kancing.png" type="image/x-icon">
    <title>Testing Website</title>

    <style type="text/css">
        *{
            text-decoration: none;
        }

        body{
            background-color: #E8E2DB;
        }

        .navbar{
            background-color: #30364F;
            font-family: calibri;
            padding-right: 15px;
            padding-left: 15px;
        }

        .navdiv{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo img{
            width: 100px;
            margin-top: 5%;
        }

        li{
            list-style: none;
            display: inline-block;
            align-items: center;
        }

        li a{
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-right: 25px;
        }

        button{
            background-color: white;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 90px;
        }

        button a{
            color: black;
            font-weight: bold;
            font-size: 15px;
        }

        .popup{
            width: 400px;
    background: #fff;
    border-radius: 6px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Add these to fix the inside look */
    padding: 30px; 
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <img src="polaroid.png" alt="sakura">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="contactus.html">Contact</a></li>
                <button><a href="signin.html">Sign In</a></button>
                <button><a href="login.html">Log in</a></button>
                </div>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="form">
            <div class="contact-info">
                <h3 class="title">
                    ⋮ ⌗ ┆
                </h3>
                <p>
                    this is not needed to be filled out acurately, just fill it however you like and just click because this web don't collect any data from users !
                </p>

            </div>
            <div class="contact-form">
                <form action="">
                    <h3 class="title">
                        Contact !
                    </h3>
                    <div class="input-container">
                        <input type="text" name="name" class="input">
                        <label for="">Username</label>
                    </div>
                    <div class="input-container">
                        <input type="email" name="email" class="input">
                        <label for="">Email</label>
                    </div>
                    <div class="input-container">
                        <input type="tel" name="Phone Number" class="input">
                        <label for="">Phone Number</label>
                    </div>
                    <div class="input-container textarea">
                        <textarea name="Message" class="input"></textarea>
                        <label for="">Message</label>
                    </div>
                    <button class="btn">
                        <a href="Newweb.html">Send</a>
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
