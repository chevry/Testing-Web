<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="newweb.css">
    <link rel="shortcut icon" href="kancing.png" type="image/x-icon">
    <title>Testing Website</title>
  </head>
  <body>

    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>Seems like you got a message.. Open it!</p>
    </div>

    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">I like you.. Do you like me back?</h1>

        <img src="hamster blush.jpg" class="hamster" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="https://i.pinimg.com/736x/83/62/4d/83624d34698b75d9eee83b36b7edf55f.jpg" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="https://i.pinimg.com/originals/0b/0d/79/0b0d79ae7fd89b7c1d3b87ed55614def.gif" class="btn no-btn" alt="No" />
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
